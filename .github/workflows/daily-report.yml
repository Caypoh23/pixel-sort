name: Daily report

# Every morning (08:17 Tashkent): pull the play funnel from PostHog into reports/latest.md.
# Needs the POSTHOG_PERSONAL_API_KEY repository secret (PostHog project 658447, US cloud).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the report from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: "658447"
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
        run: python3 scripts/report.py
      - name: Commit the report
        run: |
          if [ -n "$(git status --porcelain reports docs/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports docs/data
            git commit -m "Daily report $(date -u +%F)"
            git pull --rebase
            git push
          fi
