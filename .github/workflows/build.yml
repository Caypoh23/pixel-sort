name: Build site and clips

# Unpacks kit.txt on its first run, then builds levels, the web demo, icons and all gameplay clips
# with the engine in tools/engine and commits the result. Run it again by hand after engine changes.
on:
  push:
    paths:
      - "kit.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the kit
        run: |
          if [ -f kit.txt ]; then
            python3 - <<'PY'
          import hashlib, os, re, sys
          s = open("kit.txt", encoding="utf-8").read()
          parts = re.split(r"^@@@FILE (\S+) ([0-9a-f]{64})\n", s, flags=re.M)
          bad = []
          for i in range(1, len(parts), 3):
              path, sha, body = parts[i], parts[i + 1], parts[i + 2]
              if hashlib.sha256(body.encode()).hexdigest() != sha:
                  bad.append(path)
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              open(path, "w", encoding="utf-8").write(body)
          print("unpacked", len(parts) // 3, "files")
          if bad:
              sys.exit("hash mismatch: " + ", ".join(bad))
          PY
            git rm -q kit.txt
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright numpy
          python -m playwright install --with-deps chromium
          cd tools/engine && npm install --no-audit --no-fund
      - name: Build levels, site and icons
        working-directory: tools/engine
        run: |
          python3 gen_levels.py
          python3 build.py --video
          python3 build_site.py ../.. https://caypoh23.github.io/pixel-sort/
          python3 make_assets.py ../../docs
      - name: Render gameplay clips
        working-directory: tools/engine
        run: |
          python3 render.py
          mkdir -p ../../docs/clips
          cp out/*.mp4 ../../docs/clips/
      - name: Posting schedule
        run: |
          python3 tools/make_schedule.py
          python3 -c "import json; p='content/schedule.json'; s=json.load(open(p)); s['site_url']='https://caypoh23.github.io/pixel-sort/'; json.dump(s, open(p, 'w'), indent=1, ensure_ascii=False)"
          [ -f content/posted.json ] || echo '{}' > content/posted.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build the site, icons and clips" || exit 0
          git pull --rebase -q
          git push
